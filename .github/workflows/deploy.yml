name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - name: Install browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Check types, catalogs, SEO and browsers
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Download public Google tag for isolated test
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: curl --fail --silent --show-error --retry 2 'https://www.googletagmanager.com/gtag/js?id=G-3S75NJZ588' -o "$RUNNER_TEMP/gtag.js"
      - name: Verify real Google tag without sending events
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GA4_TAG_FIXTURE: ${{ runner.temp }}/gtag.js
        run: ./node_modules/.bin/playwright test tests/analytics-live.spec.ts --reporter=list
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload site for deployment
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
